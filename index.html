<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Reviews Widget Playground</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Controls */
        aside {
            width: 300px;
            background: white;
            padding: 24px;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 16px 0;
            color: #111827;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
        }

        select,
        input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 0.875rem;
            background: white;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            overflow-y: auto;
        }

        .preview-area {
            background: white;
            border-radius: 12px;
            padding: 40px;
            min-height: 400px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Code Snippet */
        .code-snippet {
            background: #1f2937;
            color: #f3f4f6;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Dark Mode Canvas Toggle */
        body.dark-canvas main {
            background-color: #111827;
        }

        body.dark-canvas .preview-area {
            background-color: #1f2937;
            border-color: #374151;
        }
    </style>
</head>

<body>
    <aside>
        <div>
            <h1>Widget Playground</h1>
            <p style="font-size: 0.875rem; color: #6b7280; margin-top: -12px;">Customize and copy embed code.</p>
        </div>

        <div class="control-group">
            <label for="theme">Theme</label>
            <select id="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>

        <div class="control-group">
            <label for="layout">Layout</label>
            <select id="layout">
                <option value="grid">Grid</option>
                <option value="carousel">Carousel</option>
            </select>
        </div>

        <div class="control-group">
            <label>Embed Code</label>
            <div class="code-snippet" id="embed-code">
                <!-- Widget Script -->
                <script type="module" src="https://cdn.jsdelivr.net/gh/USERNAME/REPO@main/dist/widget.js"></script>

                <!-- Widget Element -->
                <google-reviews-widget src="reviews.json" theme="light" layout="grid">
                </google-reviews-widget>
            </div>
            <button class="copy-btn" id="copy-btn">Copy</button>
        </div>

        <div class="control-group" style="margin-top: auto;">
            <label style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" id="canvas-dark"> Dark Background
            </label>
        </div>
    </aside>

    <main>
        <div class="preview-area">
            <google-reviews-widget src="/reviews.json"></google-reviews-widget>
        </div>
    </main>

    <script type="module" src="/src/widget.ts"></script>
    <script>
        const widget = document.querySelector('.preview-area google-reviews-widget');
        const themeSelect = document.getElementById('theme');
        const layoutSelect = document.getElementById('layout');
        const canvasToggle = document.getElementById('canvas-dark');
        const embedCode = document.getElementById('embed-code');
        const copyBtn = document.getElementById('copy-btn');

        function updateWidget() {
            const theme = themeSelect.value;
            const layout = layoutSelect.value;

            widget.setAttribute('theme', theme);
            widget.setAttribute('layout', layout);

            const code = `<!-- Widget Script -->
<script type="module" src="https://cdn.jsdelivr.net/gh/USERNAME/REPO@main/dist/widget.js"><\/script>

<!-- Widget Element -->
<google-reviews-widget 
  src="reviews.json" 
  theme="${theme}" 
  layout="${layout}">
<\/google-reviews-widget>`;

            embedCode.textContent = code;
        }

        themeSelect.addEventListener('change', updateWidget);
        layoutSelect.addEventListener('change', updateWidget);

        canvasToggle.addEventListener('change', (e) => {
            document.body.classList.toggle('dark-canvas', e.target.checked);
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(embedCode.textContent);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied!';
            setTimeout(() => copyBtn.textContent = originalText, 2000);
        });

        // Initial update
        updateWidget();
    </script>
</body>

</html>
